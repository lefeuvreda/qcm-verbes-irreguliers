const STORAGE_KEY='verbes-irreguliers-qcm-v1';
const fields={base:'Base verbale',past:'Prétérit',pp:'Participe passé',fr:'Traduction'};
const targets=['past','pp','past','fr','pp','past','pp','fr','past','pp'];
const SERIES=Array.from({length:11},(_,i)=>{let first=WORDS.slice(i*10,i*10+10);let repeats=i===10?WORDS.slice(0,10-first.length):[];return {id:'s'+(i+1),index:i+1,items:first.concat(repeats),newCount:first.length,reviewCount:repeats.length};});
function load(){try{let v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return {dates:v.dates||{},scores:v.scores||{},columns:v.columns===1?1:2};}catch{return {dates:{},scores:{},columns:2};}}
const settings=load();
let route={page:'home'},quiz=null,lastResult=null,searchText='';
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let arr=[...a];for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;};
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(settings));}catch{}}
function dateLabel(id){let d=settings.dates[id];if(!d)return'Date à définir';let date=new Date(d+'T12:00:00');return Number.isNaN(date.getTime())?'Date à définir':new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(date);}
const sessionFor=id=>SERIES.find(x=>x.id===id);
const statFor=id=>settings.scores[id]||null;
function navTo(page,id){route={page,id};if(page!=='quiz'&&page!=='results')quiz=null;render();window.scrollTo({top:0,behavior:'instant'});}
function navMarkup(){let active=route.page;const main=[['home','Accueil'],['sessions','Toutes les séances'],['table','Tableau de révision'],['settings','Planifier les dates']];return `<div class="nav-title">Réviser</div><div class="nav-list">${main.map(([id,label])=>`<button class="nav-btn ${active===id?'active':''}" data-go="${id}">${label}</button>`).join('')}<button class="nav-btn ${active==='quiz'&&route.id==='final'?'active':''}" data-start="final"><span>QCM final</span><span class="nav-small">10 verbes</span></button></div><div class="nav-title" style="margin-top:25px">Séries de 10 verbes</div><div class="nav-list sessions-list">${SERIES.map(s=>`<button class="nav-btn ${active==='quiz'&&route.id===s.id?'active':''}" data-start="${s.id}"><span>Série ${String(s.index).padStart(2,'0')}</span><span class="nav-small">${statFor(s.id)?statFor(s.id).best+'/10':'○'}</span></button>`).join('')}</div>`;}
function render(){ $('sideNav').innerHTML=navMarkup();let p=route.page;let name=({home:'Accueil',sessions:'Séances de révision',table:'Tableau de référence',settings:'Dates et paramètres',quiz:route.id==='final'?'Évaluation finale':'Entraînement',results:'Résultats du QCM'})[p]||'Entraînement';$('breadcrumb').textContent=name;$('app').innerHTML=({home:homeView,sessions:sessionsView,table:tableView,settings:settingsView,quiz:quizView,results:resultsView})[p]?.()||homeView();bind();}
function heroButton(label,data,cls='btn-primary'){return `<button class="btn ${cls}" ${data}>${label}</button>`;}
function scoreStatCount(){return SERIES.filter(s=>!!statFor(s.id)).length;}
function homeView(){let completed=scoreStatCount();return `<div class="hero"><div class="eyebrow">Anglais · verbes irréguliers</div><h1>Un verbe après l'autre.<br>Une série à la fois.</h1><p>Observe les quatre colonnes, choisis la bonne forme, puis vérifie ta réponse. Chaque QCM contient exactement 10 verbes et se termine par une note sur 10.</p><div class="actions">${heroButton(completed?'Continuer les révisions':'Commencer la série 1',`data-start="${SERIES.find(s=>!statFor(s.id))?.id||'s1'}"`)}${heroButton('Voir le tableau',`data-go="table"`,'btn-quiet')}</div></div><div class="stats"><div class="stat"><div class="stat-caption">Verbes du document</div><div class="stat-number">102</div><div class="stat-caption">2 pages · quatre colonnes</div></div><div class="stat"><div class="stat-caption">Séries proposées</div><div class="stat-number">11</div><div class="stat-caption">10 questions par série</div></div><div class="stat"><div class="stat-caption">Séries déjà travaillées</div><div class="stat-number">${completed}<span class="small muted"> / 11</span></div><div class="stat-caption">Résultats gardés dans ce navigateur</div></div></div><div class="section-head"><div><h2>Parcours d'entraînement</h2><p>Les verbes suivent l'ordre des deux listes fournies.</p></div><button class="btn btn-small" data-go="sessions">Afficher les 11 séries</button></div><div class="session-grid">${SERIES.slice(0,4).map(sessionCard).join('')}</div><div class="final-banner"><div><div class="eyebrow">Après les séances</div><h2>Le QCM final</h2><p>10 verbes choisis au hasard parmi les 102, pour vérifier ce que tu as retenu.</p></div><button class="btn btn-primary" data-start="final">Lancer le QCM final</button></div><p class="bottom-note">Aucune date n'apparaît dans les deux listes fournies. Elles peuvent être saisies dans « Planifier les dates ».</p>`;}
function sessionCard(s){let st=statFor(s.id);let label=s.items.map(x=>x.base);return `<article class="session-card"><div class="card-upper"><span class="sess-tag">Série ${String(s.index).padStart(2,'0')}</span><span class="sess-date">${escapeHtml(dateLabel(s.id))}</span></div><h3>${escapeHtml(label[0])} <span class="muted" aria-hidden="true">→</span> ${escapeHtml(label[s.newCount-1])}</h3><p>${s.newCount} nouveau${s.newCount>1?'x':''} verbe${s.newCount>1?'s':''}${s.reviewCount?' et '+s.reviewCount+' verbes à revoir':''} · 10 questions${s.reviewCount?'<br><span class="last-flag">Révisions incluses</span>':''}</p><div class="session-card-footer"><span class="score-chip">${st?`Meilleur score : <strong>${st.best}/10</strong>`:'Pas encore commencée'}</span><button class="btn btn-small ${st?'btn-soft':'btn-primary'}" data-start="${s.id}">${st?'Refaire':'Commencer'}</button></div></article>`;}
function sessionsView(){return `<div class="eyebrow">Programme</div><h1>Les séries par date</h1><p class="intro">Chaque série contient 10 verbes et possède sa propre date. La dernière inclut 2 nouveaux verbes et 8 verbes déjà rencontrés afin de conserver 10 questions.</p><div class="section-head"><h2>11 séries de 10 questions</h2><button class="btn btn-small" data-go="settings">Modifier les dates</button></div><div class="session-grid">${SERIES.map(sessionCard).join('')}</div><div class="final-banner"><div><h2>QCM final : toute la liste</h2><p>10 verbes aléatoires tirés des deux pages du document.</p></div><button class="btn btn-primary" data-start="final">Lancer le QCM final</button></div>`;}
function choiceSet(word,target,context){let correct=word[target];let fromSession=shuffle(context.filter(w=>w!==word).map(w=>w[target]).filter(v=>v!==correct));let fromAll=shuffle(WORDS.filter(w=>w!==word).map(w=>w[target]).filter(v=>v!==correct));let used=new Set([correct]);let picks=[];for(let pool of [fromSession,fromAll]){for(let val of pool){if(used.has(val))continue;used.add(val);picks.push(val);if(picks.length>=3)break;}if(picks.length>=3)break;}return shuffle([correct,...picks.slice(0,3)]);}
function beginQuiz(id,preferred=null){let sess=sessionFor(id);let items=id==='final'?shuffle(WORDS).slice(0,10):[...sess.items];if(preferred&&preferred.length){let bad=preferred.map(base=>items.find(w=>w.base===base)).filter(Boolean);let rest=items.filter(w=>!bad.includes(w));items=[...shuffle(bad),...shuffle(rest)].slice(0,10);}let t=shuffle([...targets]);quiz={id,index:0,score:0,questions:items.map((w,i)=>({word:w,target:t[i],options:choiceSet(w,t[i],items),answer:null})),wrong:[],startedAt:Date.now()};route={page:'quiz',id};render();window.scrollTo({top:0,behavior:'instant'});}
function quizView(){if(!quiz)return homeView();let q=quiz.questions[quiz.index];let id=quiz.id;let sess=sessionFor(id);let heading=id==='final'?'QCM final':`Série ${String(sess.index).padStart(2,'0')}`;let tag=id==='final'?'102 verbes au programme':dateLabel(id);let answered=q.answer!==null;let rows=Object.entries(fields).map(([key,label])=>`<div class="form-cell ${key===q.target?'target':''} ${answered&&key===q.target?'revealed':''}"><span class="field-label">${label}</span><div class="field-value">${key===q.target?(answered?escapeHtml(q.word[q.target]):'À compléter') :escapeHtml(q.word[key])}</div></div>`).join('');let choices=q.options.map((v,i)=>{let cls=answered?(v===q.word[q.target]?'correct':q.answer===v?'wrong':''):'';return `<button class="choice ${cls}" data-option="${i}" ${answered?'disabled':''} aria-label="Réponse ${i+1} : ${escapeHtml(v)}"><span class="letter">${'ABCD'[i]}</span><span>${escapeHtml(v)}</span></button>`;}).join('');let isCorrect=q.answer===q.word[q.target];return `<div class="eyebrow">${escapeHtml(tag)}</div><h1>${heading}</h1><div class="info-row"><span class="meta"><strong>10 verbes</strong> par QCM</span><span class="meta"><strong>4 colonnes</strong> pour se repérer</span><span class="meta">Score actuel : <strong>${quiz.score} / ${quiz.index+(answered?1:0)}</strong></span></div><section class="card quiz-card" aria-label="Question ${quiz.index+1}"><div class="quiz-top"><span class="question-count">QUESTION ${quiz.index+1} SUR 10</span><span class="small muted">Page ${q.word.page} de la liste</span></div><div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="${quiz.index}" aria-label="Progression des questions"><div class="bar-fill" style="width:${quiz.index*10}%"></div></div><h2 class="prompt">Complète la colonne « ${fields[q.target].toLowerCase()} ».</h2><p class="explain">Lis la ligne du verbe et choisis une seule proposition.</p><div class="form-grid" aria-label="Tableau des formes verbales">${rows}</div><div class="choices-label">Choisis la bonne réponse</div><div class="choices ${settings.columns===1?'one-col':''}" role="group" aria-label="Réponses possibles">${choices}</div>${answered?`<div class="feedback ${isCorrect?'':'fail'}" role="status"><strong>${isCorrect?'Bonne réponse !':'À revoir'}</strong>${isCorrect?`La forme « ${escapeHtml(q.word[q.target])} » est correcte.`:`La bonne réponse est « ${escapeHtml(q.word[q.target])} » pour le verbe « ${escapeHtml(q.word.base)} ».`}</div>`:''}<div class="quiz-footer"><div class="switch-wrap">Choix sur <button class="chip-btn ${settings.columns===1?'selected':''}" data-cols="1" aria-pressed="${settings.columns===1}">1 colonne</button><button class="chip-btn ${settings.columns===2?'selected':''}" data-cols="2" aria-pressed="${settings.columns===2}">2 colonnes</button></div>${answered?`<button class="btn btn-primary" id="btnNext">${quiz.index===9?'Voir mon résultat':'Question suivante'} →</button>`:'<span class="kbd">Touches 1 à 4 pour répondre</span>'}</div></section><p class="bottom-note">Prétérit = passé simple anglais. Le participe passé sert notamment avec « have ». Lorsque deux variantes sont indiquées dans le document, elles sont conservées ensemble.</p>`;}
function submitAnswer(index){if(!quiz)return;let q=quiz.questions[quiz.index];if(q.answer!==null||index<0||index>3)return;q.answer=q.options[index];if(q.answer===q.word[q.target])quiz.score++;else quiz.wrong.push({word:q.word.base,target:q.target,chosen:q.answer,correct:q.word[q.target]});render();}
function nextQuestion(){if(!quiz||quiz.questions[quiz.index].answer===null)return;if(quiz.index<9){quiz.index++;render();window.scrollTo({top:0,behavior:'smooth'});}else finishQuiz();}
function finishQuiz(){if(!quiz)return;let id=quiz.id;let prev=settings.scores[id]||{best:0,attempts:0};settings.scores[id]={best:Math.max(prev.best,quiz.score),last:quiz.score,attempts:prev.attempts+1,updated:new Date().toISOString()};save();lastResult={id,score:quiz.score,wrong:[...quiz.wrong],questions:quiz.questions};quiz=null;navTo('results',id);}
function resultsView(){if(!lastResult)return `<h1>Résultats</h1><p>Aucun QCM n'a encore été terminé.</p><button class="btn btn-primary" data-go="sessions">Choisir une séance</button>`;let r=lastResult;let percentage=r.score*10;let label=r.score===10?'Parfait, toutes les réponses sont justes.':r.score>=7?'Bon résultat. Revois les quelques verbes qui posent problème.':r.score>=4?'Tu progresses. Relis les formes et recommence la série.':'Reprends le tableau de révision, puis retente le QCM.';return `<div class="eyebrow">Bilan de la séance</div><h1>Résultat du QCM</h1><div class="card results-card"><div class="score-layout"><div class="score-circle" style="--pct:${percentage}%"><div class="score-inner"><strong>${r.score}<span style="display:inline;font-size:1.25rem;color:#6c8395">/10</span></strong><span>${percentage}% de réussite</span></div></div><div><span class="pill">${r.id==='final'?'QCM final':`Série ${sessionFor(r.id)?.index}`}</span><h2 style="margin-top:14px">${r.score===10?'Excellent travail !':'Tes résultats'}</h2><p class="muted" style="margin:12px 0 0">${label}</p><p class="small muted" style="margin-top:13px"><strong>${10-r.wrong.length}</strong> réponse(s) correcte(s) · <strong>${r.wrong.length}</strong> réponse(s) à revoir.</p><div class="actions"><button class="btn btn-primary" data-start="${r.id}">Refaire un QCM</button><button class="btn btn-soft" onclick="window.print()">Imprimer mon score</button></div></div></div></div>${r.wrong.length?`<div class="section-head" style="margin-top:29px"><div><h2>Les verbes à revoir</h2><p>Compare ta réponse avec la bonne forme.</p></div></div><div class="table-scroll card"><table class="review-table"><thead><tr><th>Base verbale</th><th>Colonne</th><th>Ta réponse</th><th>Bonne réponse</th></tr></thead><tbody>${r.wrong.map(w=>`<tr><td><strong>${escapeHtml(w.word)}</strong></td><td>${fields[w.target]}</td><td>${escapeHtml(w.chosen)}</td><td>${escapeHtml(w.correct)}</td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" data-start="${r.id}">Recommencer la série</button><button class="btn btn-soft" data-go="table">Revoir le tableau complet</button></div>`:`<div class="callout">Toutes les réponses sont correctes. Tu peux passer à la séance suivante ou essayer le QCM final.</div>`}<div class="actions" style="margin-top:22px"><button class="btn btn-primary" data-go="sessions">Toutes les séances</button><button class="btn" data-start="final">Essayer le QCM final</button></div>`;}
function tableView(){let filter=searchText.trim().toLocaleLowerCase('fr');let matched=WORDS.filter(w=>Object.values(w).some(value=>String(value).toLocaleLowerCase('fr').includes(filter)));return `<div class="eyebrow">Fiche de référence</div><h1>Le tableau des 102 verbes</h1><p class="intro">Retrouve les quatre colonnes du document : base verbale, prétérit, participe passé et traduction. Les deux pages originales ont été rassemblées dans un même tableau.</p><div class="ref-head"><label class="sr-only" for="wordSearch">Rechercher un verbe ou une traduction</label><input class="searchbox" id="wordSearch" type="search" placeholder="Rechercher un verbe ou une traduction…" value="${escapeHtml(searchText)}" autocomplete="off"><button class="btn btn-small" id="printTable">Imprimer le tableau</button></div><div class="small muted" style="margin-bottom:10px" id="matches">${matched.length} verbe${matched.length>1?'s':''}</div><div class="table-scroll card"><table class="ref-table"><thead><tr><th>Base verbale</th><th>Prétérit</th><th>Participe passé</th><th>Traduction</th></tr></thead><tbody id="referenceRows">${matched.map(w=>`<tr><td>${escapeHtml(w.base)}</td><td>${escapeHtml(w.past)}</td><td>${escapeHtml(w.pp)}</td><td>${escapeHtml(w.fr)}</td></tr>`).join('')}</tbody></table></div><p class="bottom-note">Les variantes séparées par / et les traductions proviennent des deux listes jointes. Pour « read », la graphie est identique au présent et au passé, mais la prononciation change.</p>`;}
function settingsView(){return `<div class="eyebrow">Organisation pédagogique</div><h1>Planifier les dates</h1><p class="intro">Attribue une date à chaque série. Les dates n'étaient pas indiquées sur les documents : tu peux donc les organiser selon la progression de ta classe. Les changements sont enregistrés automatiquement sur cet appareil.</p><div class="callout">Chaque série conserve son groupe de 10 verbes. La série 11 reprend 8 verbes déjà étudiés pour compléter les 2 derniers verbes de la liste.</div><div class="card config-card"><div class="section-head"><h2>Calendrier des séries</h2><button class="btn btn-small" id="clearDates">Effacer les dates</button></div><div class="date-grid">${SERIES.map(s=>`<label class="date-row"><span><strong>Série ${String(s.index).padStart(2,'0')}</strong><span>${escapeHtml(s.items[0].base)} → ${escapeHtml(s.items[s.newCount-1].base)}${s.reviewCount?' + révisions':''}</span></span><input type="date" data-date="${s.id}" value="${escapeHtml(settings.dates[s.id]||'')}" aria-label="Date de la série ${s.index}"></label>`).join('')}</div></div><div class="card config-card"><h2>Présentation des réponses</h2><p class="muted small" style="margin:8px 0 12px">Choisis le nombre de colonnes pour les propositions. Sur téléphone, elles s'affichent sur une colonne pour rester lisibles.</p><div class="actions"><button class="btn ${settings.columns===1?'btn-primary':''}" data-cols="1">1 colonne</button><button class="btn ${settings.columns===2?'btn-primary':''}" data-cols="2">2 colonnes</button></div></div><div class="card config-card"><h2>Résultats enregistrés</h2><p class="muted small" style="margin:8px 0 15px">Les scores restent dans ce navigateur. Aucun compte et aucune connexion Internet ne sont nécessaires. Les résultats ne sont pas partagés automatiquement avec l'enseignant.</p><button class="btn" id="clearScores">Effacer tous les scores</button></div><div class="actions"><button class="btn btn-primary" data-go="sessions">Retour aux séances</button></div>`;}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>navTo(b.dataset.go)));document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>beginQuiz(b.dataset.start)));document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>submitAnswer(Number(b.dataset.option))));$('btnNext')?.addEventListener('click',nextQuestion);document.querySelectorAll('[data-cols]').forEach(b=>b.addEventListener('click',()=>{settings.columns=Number(b.dataset.cols);save();render();}));document.querySelectorAll('[data-date]').forEach(b=>b.addEventListener('change',()=>{if(b.value)settings.dates[b.dataset.date]=b.value;else delete settings.dates[b.dataset.date];save();}));$('clearDates')?.addEventListener('click',()=>{if(confirm('Effacer toutes les dates des séances ?')){settings.dates={};save();render();}});$('clearScores')?.addEventListener('click',()=>{if(confirm('Effacer définitivement tous les résultats enregistrés sur cet appareil ?')){settings.scores={};save();render();}});$('printTable')?.addEventListener('click',()=>window.print());$('wordSearch')?.addEventListener('input',e=>{searchText=e.target.value;let filter=searchText.trim().toLocaleLowerCase('fr'),match=WORDS.filter(w=>Object.values(w).some(v=>String(v).toLocaleLowerCase('fr').includes(filter)));$('referenceRows').innerHTML=match.map(w=>`<tr><td>${escapeHtml(w.base)}</td><td>${escapeHtml(w.past)}</td><td>${escapeHtml(w.pp)}</td><td>${escapeHtml(w.fr)}</td></tr>`).join('');$('matches').textContent=`${match.length} verbe${match.length>1?'s':''}`;});}
document.addEventListener('keydown',e=>{if(route.page!=='quiz'||!quiz||/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;if(/^[1-4]$/.test(e.key)&&quiz.questions[quiz.index].answer===null){e.preventDefault();submitAnswer(Number(e.key)-1);}else if(e.key==='Enter'&&quiz.questions[quiz.index].answer!==null){e.preventDefault();nextQuestion();}});
render();
</script>
</body></html>
